<!doctype html>
<html><head><meta charset="utf-8"><title>Register - ChatNest</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-page"><div class="auth-card"><h1>ChatNest</h1><p>Create your account.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (6+ characters)" required><button>Register</button></form>
<p class="small">Already registered? <a href="/login/">Login</a></p></div></body></html>
